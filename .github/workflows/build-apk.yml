name: Build debug APK

# Runs automatically on every push to main, and can also be run manually
# from the "Actions" tab in GitHub ("Run workflow" button).
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the SDK platform/build-tools this project needs
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # This project doesn't ship a gradle-wrapper.jar binary (it can't be
      # generated offline), so we install Gradle itself here instead of
      # calling ./gradlew. Version must match android-app/gradle/wrapper/gradle-wrapper.properties.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wl-orders-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
